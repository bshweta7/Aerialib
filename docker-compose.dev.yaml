services:

  backend:
    container_name: backend_container
    build:
      context: ./backend
      dockerfile: "dev.Dockerfile"
    restart: always
    environment:
      - DB_HOST=db
      - DB_USERNAME=postgres
      - DB_PASSWORD=aerialib_postgres_secret_password
      - DB_DATABASE=aerialib
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      - db

  db:
    build:
      context: ./db
      dockerfile: "Dockerfile"
    container_name: db_container
    restart: always
    environment:
      POSTGRES_DB: aerialib
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aerialib_postgres_secret_password
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data #TODO Check if this should move to ./db

volumes:
  postgres_data:
