services:

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8192:80"

  backend:
    container_name: backend_container
    build:
      context: ./backend
      dockerfile: "Dockerfile"
    restart: always
    environment:
      - DB_HOST=db
      - DB_USERNAME=postgres
      - DB_PASSWORD=aerialib_postgres_secret_password
      - DB_DATABASE=aerialib
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - db

  db:
    build:
      context: ./db
      dockerfile: "Dockerfile"
    container_name: db_container
    restart: always
    environment:
      POSTGRES_DB: aerialib
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aerialib_postgres_secret_password
    ports:
      - "5432:5432"
    volumes:
      - ./db_postgres:/var/lib/postgresql/data 
      - ./db_backups:/db_backups 
